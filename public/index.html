<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopPulse - Modern E-Commerce</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- AUTH SECTION (Login / Register) -->
    <div id="auth-section" class="auth-container">
        <div class="auth-card">
            <h2>⚡ ShopPulse</h2>
            <p id="auth-subtitle">Sign in to your store account</p>
            
            <form id="auth-form" onsubmit="return false;">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required placeholder="Enter username">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter password">
                </div>
                <div id="admin-checkbox-group" class="input-group checkbox-group hidden">
                    <label>
                        <input type="checkbox" id="is-admin-reg"> Register as Admin
                    </label>
                </div>
                <button id="auth-btn" class="btn primary full">Login</button>
            </form>
            <p id="auth-switch-text" class="switch-text">
                Don't have an account? <a href="#" id="switch-mode">Register</a>
            </p>
        </div>
    </div>

    <!-- MAIN DASHBOARD SECTION (Storefront) -->
    <div id="dashboard-section" style="display: none;">
        <header class="navbar">
            <div class="logo">⚡ ShopPulse</div>
            <div class="nav-right">
                <span id="logged-in-user">👤 User</span>
                <button id="view-orders-btn" class="btn secondary">My Orders</button>
                <button id="cart-btn" class="btn secondary">🛒 Cart (<span id="cart-count">0</span>)</button>
                <button id="logout-btn" class="btn danger">Logout</button>
            </div>
        </header>

        <main class="container">
            <div id="admin-add-product-container" class="admin-panel hidden">
                <h3>Admin Controls</h3>
                <button id="open-add-product-modal" class="btn primary">+ Add New Product</button>
            </div>

            <h2>Store Products</h2>
            <div id="products-grid" class="products-grid">
                <!-- Products dynamically injected here -->
            </div>
        </main>
    </div>

    <!-- CART MODAL -->
    <div id="cart-modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-cart" class="close-btn">&times;</span>
            <h2>Your Shopping Cart</h2>
            <div id="cart-items-list"></div>
            <div class="cart-summary">
                <h3>Total: $<span id="cart-total">0.00</span></h3>
                <button id="checkout-btn" class="btn primary full">Checkout & Place Order</button>
            </div>
        </div>
    </div>

    <!-- ORDERS MODAL -->
    <div id="orders-modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-orders" class="close-btn">&times;</span>
            <h2>Order History</h2>
            <div id="orders-list"></div>
        </div>
    </div>

    <!-- ADD PRODUCT MODAL (Admin) -->
    <div id="product-modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-product-modal" class="close-btn">&times;</span>
            <h2>Add Product</h2>
            <form id="add-product-form">
                <div class="input-group">
                    <label>Title</label>
                    <input type="text" id="prod-title" required>
                </div>
                <div class="input-group">
                    <label>Description</label>
                    <input type="text" id="prod-desc">
                </div>
                <div class="input-group">
                    <label>Price ($)</label>
                    <input type="number" step="0.01" id="prod-price" required>
                </div>
                <div class="input-group">
                    <label>Category</label>
                    <input type="text" id="prod-category" required>
                </div>
                <div class="input-group">
                    <label>Image URL</label>
                    <input type="text" id="prod-image" placeholder="https://...">
                </div>
                <button type="submit" class="btn primary full">Save Product</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
